name: Publicar na Cloudflare

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testar-e-publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Só a main publica. Pull request para em teste e build.
      - name: Conferir o login na Cloudflare
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 0f8c59c72476106eeaef3ff2e92f8305
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Falta o segredo CLOUDFLARE_API_TOKEN no repositório."; exit 1; }
          npx wrangler whoami || { grep -ih "error\|code" ~/.config/.wrangler/logs/*.log | tail -20; exit 1; }
      - name: Migrações do banco
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 0f8c59c72476106eeaef3ff2e92f8305
        run: npx wrangler d1 migrations apply agencia-v30 --remote || { grep -ih "error\\|code" ~/.config/.wrangler/logs/*.log | tail -20; exit 1; }
      - name: Publicar Worker
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 0f8c59c72476106eeaef3ff2e92f8305
        run: npx wrangler deploy
